name: podborochka-deploy

services:
  postgres:
    image: ${REGISTRY_ADDRESS:-localhost:5050}/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: podborochka
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ${REGISTRY_ADDRESS:-localhost:5050}/podborochka-backend:${APP_VERSION:-0.2.0}
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/podborochka
      PORT: "8080"
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    image: ${REGISTRY_ADDRESS:-localhost:5050}/podborochka-frontend:${APP_VERSION:-0.2.0}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
