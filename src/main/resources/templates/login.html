<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Вход — Podborochka')}"></th:block>
</head>
<body class="page">
<div th:replace="~{fragments/header :: header(${isAuthenticated}, ${username})}"></div>

<main>
    <div th:replace="~{fragments/auth-form :: authForm(
        'Вход в аккаунт',
        ~{fragments/login-fields :: loginFields},
        'Войти',
        'Нет аккаунта? ',
        'Создать',
        @{/register/form},
        'login-form',
        @{/login}
    )}"></div>
</main>

<div th:replace="~{fragments/footer :: footer(false)}"></div>
</body>
</html>
