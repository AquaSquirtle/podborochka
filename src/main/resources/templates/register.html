<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Регистрация — Podborochka')}"></th:block>
</head>
<body class="page">
<div th:replace="~{fragments/header :: header(${isAuthenticated}, ${username})}"></div>

<main>
    <div th:replace="~{fragments/auth-form :: authForm(
        'Создание аккаунта',
        ~{fragments/register-fields :: registerFields},
        'Зарегистрироваться',
        'Уже есть аккаунт? ',
        'Войти',
        @{/login/form},
        'register-form',
        @{/register}
    )}"></div>
</main>

<div th:replace="~{fragments/footer :: footer(false)}"></div>
</body>
</html>
