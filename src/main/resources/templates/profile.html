<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Podborochka — Профиль')}"></th:block>
</head>
<body class="page">
<div th:replace="~{fragments/header :: header(${isAuthenticated}, ${username})}"></div>

<main class="profile-page">
    <section class="profile-card">
        <div class="profile-card__avatar-block">
            <img
                    id="profile-avatar"
                    class="profile-card__avatar"
                    src="/images/default-avatar.png"
                    alt="Аватар пользователя"
            >
        </div>

        <div class="profile-card__info">
            <h1 class="profile-card__title">Профиль</h1>

            <div class="profile-card__field">
                <span class="profile-card__label">Имя</span>
                <span id="profile-display-name" class="profile-card__value">Загрузка...</span>
            </div>

            <div class="profile-card__field">
                <span class="profile-card__label">Email</span>
                <span id="profile-email" class="profile-card__value">Загрузка...</span>
            </div>

            <div class="profile-card__field">
                <span class="profile-card__label">Роль</span>
                <span id="profile-role" class="profile-card__value">Загрузка...</span>
            </div>

            <form id="avatar-form" class="profile-card__upload-form">
                <label class="profile-card__upload-label" for="avatar-file">
                    Загрузить новый аватар
                </label>
                <input
                        id="avatar-file"
                        name="file"
                        type="file"
                        accept="image/png,image/jpeg,image/webp"
                        class="profile-card__file-input-hidden"
                >

                <label for="avatar-file" class="profile-card__file-button">
                    Выбрать файл
                </label>

                <span id="file-name" class="profile-card__file-name">
                    Файл не выбран
                </span>

                <button type="submit" class="button profile-card__upload-button">
                    Сохранить аватар
                </button>
            </form>

            <p id="profile-message" class="profile-card__message"></p>
        </div>
    </section>
</main>

<script type="module" th:src="@{/scripts/profile.js}"></script>

<div th:replace="~{fragments/footer :: footer(false)}"></div>
</body>
</html>
