<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт — Подборочка</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/frontend.css">
    <script type="module" src="/scripts/app.js"></script>
</head>
<body class="page" data-page="login">
<!-- component:header -->
<main>
<section class="auth">
    <h1 class="auth__title">Вход в аккаунт</h1>
    <form class="auth__form" id="login-form">
        <p class="auth__form-error" id="auth-error" role="alert" hidden></p>
        
    <label class="auth__label">
        <input
                class="auth__input"
                id="login-email"
                name="email" maxlength="255" autocomplete="email"
                type="email"
                placeholder="Email"
                required
        >
        <div class="auth__error" id="login-email-error"></div>
    </label>

    <label class="auth__label">
        <input
                class="auth__input"
                id="login-password"
                name="password" maxlength="255" autocomplete="current-password"
                type="password"
                placeholder="Пароль"
                required
                minlength="6"
        >
        <div class="auth__error" id="login-password-error"></div>
    </label>

        <button class="button auth__button" type="submit">Войти</button>
        <p class="auth__text">Нет аккаунта? <a href="/register/form" class="link">Создать</a></p>
    </form>
</section>
</main>
<!-- component:footer -->
</body>
</html>
