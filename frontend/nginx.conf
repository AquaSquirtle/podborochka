server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Resolve the backend by service name, including after it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Server-sent events and longer AI requests must reach the browser.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /logout {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }

    location = /login/form { try_files /login.html =404; }
    location = /register/form { try_files /register.html =404; }
    location = / { try_files /index.html =404; }
    location / { try_files $uri $uri.html =404; }
}
